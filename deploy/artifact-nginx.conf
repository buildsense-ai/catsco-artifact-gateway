# Install only after issuing this separate SAN certificate via HTTP webroot.
# Keep domain names in sync with gateway config publicHosts.
server {
 listen 80;
 server_name artifact.catsco.cc artifact.catsco.cn;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 308 https://$host$request_uri; }
}
server {
 listen 443 ssl http2;
 server_name artifact.catsco.cc artifact.catsco.cn;
 ssl_certificate /etc/letsencrypt/live/artifact-gateway/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/artifact-gateway/privkey.pem;
 include /etc/catsco-artifact-gateway/artifact-locations.conf;
 location / { return 404; }
}
