name: Deploy Artifact Gateway

# The gateway is not a container: it is source files, one root helper and two
# systemd units on the gateway host. Deploying therefore means "copy the source,
# make sure the units are installed and current, apply the config, restart the
# control plane" — and it has to be idempotent, because it also runs on every
# later merge. That is what makes publishing self-service: nobody has to log in
# to the gateway host to install or update it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cag-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GATEWAY_ROOT: /opt/catsco-artifact-gateway
      UNIT: catsco-artifact-gateway-control-plane
      WSS_UNIT: catsco-artifact-gateway-wss-p0
      # The tunnel limit the adapter must report after a deploy. Kept here so the
      # deploy fails loudly if the default reverts, instead of only checking that
      # the field exists. Change this together with DEFAULT_TUNNEL_MAX_CONNECTIONS.
      EXPECTED_TUNNEL_MAX: "160"
    steps:
      - uses: actions/checkout@v6

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host cag
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ServerAliveInterval 15
            ServerAliveCountMax 40
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload the source
        run: |
          tar -czf - src scripts deploy docs package.json package-lock.json README.md \
            | ssh cag "sudo -n tar -xzf - -C $GATEWAY_ROOT && sudo -n chown -R root:root $GATEWAY_ROOT/src $GATEWAY_ROOT/scripts $GATEWAY_ROOT/deploy $GATEWAY_ROOT/docs $GATEWAY_ROOT/package.json $GATEWAY_ROOT/package-lock.json $GATEWAY_ROOT/README.md"

      - name: Ensure the runtime dependency is present
        # The control plane is a plain node process; `ws` is its only dependency
        # and it is already installed on the host. Failing loudly here is better
        # than deploying a process that cannot load. The check needs sudo: the
        # gateway tree is root-owned and node_modules is 0750, so the deploy user
        # cannot see it without asking.
        run: ssh cag "sudo -n test -d $GATEWAY_ROOT/node_modules/ws || { echo 'missing node_modules/ws — run npm ci in $GATEWAY_ROOT on the gateway host'; exit 1; }"

      - name: Install or refresh the units
        # Everything here is idempotent: the root helper, the path unit that
        # watches gateway.json, and the two long-running units. The control plane
        # needs ReadWritePaths, or the registration API cannot write its own
        # config. The WSS adapter is installed here too, or a change to its limit
        # would be copied to the host and never take effect: it reads that file
        # only at startup, and nothing else installs its unit.
        run: |
          ssh cag "set -e
            sudo -n chmod 755 $GATEWAY_ROOT/deploy/apply-config.sh
            sudo -n install -m 644 $GATEWAY_ROOT/deploy/cag-apply.service $GATEWAY_ROOT/deploy/cag-apply.path /etc/systemd/system/
            sudo -n install -m 644 $GATEWAY_ROOT/deploy/control-plane.service /etc/systemd/system/$UNIT.service
            sudo -n install -m 644 $GATEWAY_ROOT/deploy/ws-gateway.service /etc/systemd/system/$WSS_UNIT.service
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable --now cag-apply.path"

      - name: Apply the current config
        # Installing the watcher applies nothing by itself: it reacts to a change.
        # The first deploy after this workflow exists therefore has to ask for one
        # pass explicitly, so nginx picks up routes it has not seen before.
        run: ssh cag "sudo -n systemctl start cag-apply.service"

      - name: Restart the control plane
        run: |
          ssh cag "sudo -n systemctl restart $UNIT"
          sleep 2
          ssh cag "sudo -n systemctl is-active $UNIT"

      - name: Restart the WSS adapter
        # The adapter reads TUNNEL_MAX_CONNECTIONS once, at startup, so a copied
        # source file is not a deployed change. Restarting drops the open tunnels;
        # connectors treat that as a normal disconnect and reconnect within a few
        # seconds.
        run: |
          set -e
          ssh cag "sudo -n systemctl restart $WSS_UNIT"
          sleep 2
          ssh cag "sudo -n systemctl is-active $WSS_UNIT"
          # `/_gateway/health` belongs to the control plane, so it cannot report
          # anything about the adapter. Ask the adapter on its loopback port
          # instead, and compare the value rather than only looking for the field:
          # a deploy that left the limit at its old default would otherwise pass.
          health=$(ssh cag "curl -fsS http://127.0.0.1:22444/health")
          echo "wss health: $health"
          echo "$health" | grep -q "\"maxConnections\":$EXPECTED_TUNNEL_MAX"

      - name: Verify
        run: |
          set -e
          health=$(curl -fsS https://artifact.catsco.cc/_gateway/health)
          echo "health: $health"
          echo "$health" | grep -q '"ok":true'
          # Registration is a platform-to-gateway call, so it must be reachable
          # from outside on both public domains, and refuse an anonymous caller.
          for host in artifact.catsco.cc artifact.catsco.cn; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$host/_gateway/apps")
            echo "$host /_gateway/apps -> $code"
            test "$code" = "401"
          done
